<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theHunter Data Processor - Competencias (jugadores corregido)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e2a2e;
            color: #e0f2fe;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #0f172a;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #fbbf24; font-size: 1.8rem; margin-top: 0; margin-bottom: 0.5rem; }
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: bold;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 0.5rem 0.5rem 0 0;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #2c4c40;
            color: #fbbf24;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 0.5rem;
            resize: vertical;
            margin-bottom: 1rem;
        }
        button {
            background-color: #2c6e4f;
            border: none;
            color: white;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 9999px;
            cursor: pointer;
            margin-right: 1rem;
            margin-bottom: 1rem;
        }
        .result-area {
            background-color: #0a0f1a;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            overflow-x: auto;
            display: block;
        }
        th, td {
            border: 1px solid #2d3a4f;
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #2c4c40;
            color: #fbbf24;
            cursor: pointer;
        }
        .output-text {
            background-color: #0f172a;
            border: 1px solid #2d3a4f;
            font-family: monospace;
            padding: 1rem;
            white-space: pre-wrap;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            max-height: 300px;
            overflow: auto;
        }
        hr { border-color: #2d3a4f; margin: 1rem 0; }
        .status {
            background-color: #1e2a3a;
            border-left: 4px solid #fbbf24;
            padding: 8px 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🦌 theHunter Data Processor</h1>
    <div class="tabs">
        <button class="tab-btn active" data-tab="scores">🏆 Mejores Puntuaciones</button>
        <button class="tab-btn" data-tab="comps">⚔️ Competencias</button>
    </div>

    <div id="scores-tab" class="tab-pane active">
        <p>Pega el contenido de la página <strong>"Mejores puntuaciones personales"</strong>.</p>
        <textarea id="scoresInput" placeholder="Pega aquí..."></textarea>
        <button id="processScoresBtn">🚀 PROCESAR</button>
        <div class="status" id="scoresStatus">✅ Listo.</div>
        <div class="result-area">
            <div id="scoresTableContainer">👉 Presiona "PROCESAR"</div>
            <hr>
            <div id="scoresOutput" class="output-text"></div>
        </div>
    </div>

    <div id="comps-tab" class="tab-pane">
        <p>Pega el contenido completo de la página <strong>"Competencias"</strong> (selecciona todo y copia).</p>
        <textarea id="compsInput" placeholder="Pega aquí..."></textarea>
        <button id="processCompsBtn">🚀 PROCESAR</button>
        <div class="status" id="compsStatus">✅ Listo.</div>
        <div class="result-area">
            <div id="compsTableContainer">👉 Presiona "PROCESAR"</div>
            <hr>
            <div id="compsOutput" class="output-text"></div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. MEJORES PUNTUACIONES (código probado)
    // --------------------------------------------------------------
    const ESPECIES_OFICIALES = new Set([
        "Alce", "Banteng", "Bisonte", "Búfalo de Agua", "Cabra Salvaje", "Canguro rojo",
        "Carnero de Dall", "Cerdo Salvaje", "Ciervo Axis", "Ciervo Mulo", "Ciervo Rojo",
        "Ciervo Sambar", "Ciervo Sitka", "Ciervo de Cola Blanca", "Ciervo de Cola Negra",
        "Ciervo de Timor", "Conejo Europeo", "Conejo de Cola de Algodón", "Corzo",
        "Corzonejo", "Coyote", "Faisán", "Gamo", "Ganso Nival", "Ganso Urraco",
        "Ganso de Canadá", "Hombre Lobo", "Jabalí", "Liebre Americana", "Lince",
        "Lince Boreal", "Lobo Gris", "Muflón Canadiense", "Oso Grizzly", "Oso Negro",
        "Oso Pardo", "Oso Polar", "Pavo", "Perdiz Nival", "Perdiz Nival de la Tundra",
        "Perdiz de Cola Blanca", "Puma", "Reno", "Wapití de Roosevelt", "Wapití de las Rocosas",
        "Wendigo", "Wood Grouse", "Zorro Rojo", "Zorro Ártico", "Ánade Friso", "Ánade Rabudo",
        "Ánade Real", "Ánade Sombrío Americano", "Íbice Alpino"
    ]);

    function normalizarNombre(raw) { return raw.replace(/\s*\([^)]*\)/g, '').trim(); }
    function esEspecieValida(line) { return ESPECIES_OFICIALES.has(normalizarNombre(line)); }
    function extractUsername(text) {
        const lines = text.split(/\r?\n/);
        for (let i = 0; i < lines.length - 1; i++) {
            const curr = lines[i].trim();
            const next = lines[i+1].trim();
            if (curr && !curr.includes(' ') && next.includes('Hunter') && !next.includes('Cazador')) return curr;
        }
        const match = text.match(/(?:Configuración\s+\d+)?([A-Za-z0-9_]+)\s*\nHunter/);
        return match ? match[1] : "Usuario";
    }
    function limpiarFecha(fechaRaw) {
        let fecha = fechaRaw.replace(/\s*ART\s*/i, '').trim();
        fecha = fecha.replace(/(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})/, (match, date, hour, minute) => `${date} ${hour.padStart(2,'0')}:${minute}`);
        return fecha;
    }
    function parseBestScores(text, username) {
        const lines = text.split(/\r?\n/);
        const resultados = [];
        let i = 0, total = lines.length;
        while (i < total) {
            let line = lines[i].trim();
            if (line === "") { i++; continue; }
            if (esEspecieValida(line)) {
                let especieLimpia = normalizarNombre(line);
                let puntuacion = null, arma = null, fecha = null;
                let j = i + 1;
                while (j < total && j < i + 25) {
                    const curr = lines[j].trim();
                    if (curr === "Puntuación:" || curr.startsWith("Puntuación:")) {
                        if (j+1 < total) {
                            const scoreLine = lines[j+1].trim();
                            const match = scoreLine.match(/^(\d+(?:\.\d+)?)/);
                            if (match) puntuacion = match[1].replace('.', ',');
                        }
                    }
                    if (curr === "Armas utilizadas:" || curr.startsWith("Armas utilizadas:")) {
                        if (j+1 < total) arma = lines[j+1].trim();
                    }
                    if (curr === "Fecha de captura:" || curr.startsWith("Fecha de captura:")) {
                        if (j+1 < total) fecha = limpiarFecha(lines[j+1].trim());
                    }
                    if (puntuacion && arma && fecha) break;
                    j++;
                }
                if (puntuacion) {
                    if (resultados.length === 0 || resultados[resultados.length-1].especie !== especieLimpia) {
                        resultados.push({ especie: especieLimpia, puntuacion, arma: arma || "", fecha: fecha || "" });
                    }
                }
                i = j + 1;
            } else { i++; }
        }
        return resultados;
    }
    function generateScoresTabText(username, data) {
        return data.map(item => `${username}\t${item.especie}\t${item.puntuacion}\t${item.arma}\t${item.fecha}`).join('\n');
    }
    function generateScoresHtmlTable(username, data) {
        if (!data.length) return '<p>No hay datos</p>';
        let html = `</td><thead><tr><th>Usuario</th><th>Especie</th><th>Puntuación</th><th>Arma</th><th>Fecha</th></tr></thead><tbody>`;
        for (let item of data) html += `<tr><td>${escapeHtml(username)}</td><td>${escapeHtml(item.especie)}</td><td>${escapeHtml(item.puntuacion)}</td><td>${escapeHtml(item.arma)}</td><td>${escapeHtml(item.fecha)}</td></tr>`;
        html += `</tbody></table>`;
        return html;
    }

    // --------------------------------------------------------------
    // 2. COMPETENCIAS - VERSIÓN CORREGIDA (extrae jugadores correctamente)
    // --------------------------------------------------------------
    function convertirFecha(fechaStr) {
        const meses = { Jan:1, Feb:2, Mar:3, Apr:4, May:5, Jun:6, Jul:7, Aug:8, Sep:9, Oct:10, Nov:11, Dec:12 };
        const partes = fechaStr.trim().split(' ');
        if (partes.length < 3) return "";
        const mes = meses[partes[0]];
        let dia = parseInt(partes[1].replace(/th|st|nd|rd/, ''));
        const horaMin = partes[2];
        let hora = parseInt(horaMin.split(':')[0]);
        let minuto = parseInt(horaMin.split(':')[1]);
        const año = new Date().getFullYear();
        return `${año}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')} ${String(hora).padStart(2,'0')}:${String(minuto).padStart(2,'0')}`;
    }

    function procesarEspecieYModalidad(especieRaw) {
        let modalidad = "";
        let texto = especieRaw;
        if (texto.includes("Un jugador")) {
            modalidad = "Un jugador";
            texto = texto.replace("Un jugador", "").trim();
        } else if (texto.includes("Multijugador")) {
            modalidad = "Multijugador";
            texto = texto.replace("Multijugador", "").trim();
        }
        texto = texto.replace(/\s*\(Típico\)/g, '');
        const speciesSet = new Set();
        for (let sp of ESPECIES_OFICIALES) {
            if (texto.includes(sp)) {
                speciesSet.add(sp);
            }
        }
        let especiesFinal = speciesSet.size > 0 ? Array.from(speciesSet).join(" + ") : texto;
        return { especies: especiesFinal, modalidad: modalidad };
    }

    function extraerResumen(texto) {
        const lines = texto.split(/\r?\n/);
        let inicio = -1;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes("Enrolled competitions") && lines[i].includes("(")) {
                inicio = i;
                break;
            }
        }
        if (inicio === -1) return [];
        let idx = inicio + 1;
        while (idx < lines.length && (lines[idx].trim() === "" || lines[idx].includes("Nombre de Competición"))) idx++;
        
        const competencias = [];
        while (idx + 2 < lines.length) {
            const nombre = lines[idx].trim();
            if (nombre === "" || nombre.includes("Competiciones próximas")) break;
            const especieRaw = lines[idx+1].trim();
            const datosLine = lines[idx+2].trim();
            if (datosLine === "") break;
            
            let partes;
            if (datosLine.includes('\t')) {
                partes = datosLine.split('\t');
            } else {
                partes = datosLine.split(/\s{2,}/);
            }
            if (partes.length < 6) {
                idx += 3;
                continue;
            }
            const intentos = partes[0];
            const posicion = partes[1];
            const inicioFecha = partes[2];
            const finalFecha = partes[3];
            const estado = partes[4];
            
            const { especies, modalidad } = procesarEspecieYModalidad(especieRaw);
            
            competencias.push({
                nombre: nombre,
                especies: especies,
                intentosRaw: intentos,
                posicion: posicion,
                inicioRaw: inicioFecha,
                finalRaw: finalFecha,
                estado: estado,
                modalidad: modalidad
            });
            idx += 3;
        }
        return competencias;
    }
    
    // Extraer listado global con regex robustos para jugadores y fechas
    function extraerListadoGlobal(texto) {
        const lines = texto.split(/\r?\n/);
        let inicio = -1;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes("Nombre de Competición") && lines[i].includes("Jugadores")) {
                inicio = i;
                break;
            }
        }
        if (inicio === -1) return [];
        let idx = inicio + 1;
        while (idx < lines.length && lines[idx].trim() === "") idx++;
        
        const competencias = [];
        while (idx + 4 < lines.length) {
            const nombre = lines[idx].trim();
            if (nombre === "" || nombre.includes("RECLUTA") || nombre.includes("DEVELOPED")) break;
            const especieRaw = lines[idx+1].trim();
            // La línea de datos está en idx+4 (quinta línea del bloque)
            const datosLine = lines[idx+4].trim();
            if (datosLine === "") break;
            
            // Extraer número de jugadores (primer número al inicio de la línea, incluso con tabs o espacios)
            const jugadoresMatch = datosLine.match(/^\s*(\d+)/);
            let jugadores = jugadoresMatch ? parseInt(jugadoresMatch[1]) : 0;
            
            // Extraer las dos fechas con patrón "May 26th 04:00 ART"
            const fechaRegex = /(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}(?:th|st|nd|rd)\s+\d{2}:\d{2}\s+ART/g;
            const fechas = datosLine.match(fechaRegex);
            let inicioFecha = "", finalFecha = "";
            if (fechas && fechas.length >= 2) {
                inicioFecha = fechas[0];
                finalFecha = fechas[1];
            }
            
            const { especies, modalidad } = procesarEspecieYModalidad(especieRaw);
            
            competencias.push({
                nombre: nombre,
                especies: especies,
                jugadores: jugadores,
                inicioRaw: inicioFecha,
                finalRaw: finalFecha,
                modalidad: modalidad
            });
            idx += 5;
        }
        return competencias;
    }
    
    function fusionarCompetencias(resumen, global) {
        const mapGlobal = new Map();
        for (let g of global) {
            mapGlobal.set(g.nombre, g);
        }
        const fusionadas = [];
        for (let r of resumen) {
            const g = mapGlobal.get(r.nombre);
            const jugadores = g ? g.jugadores : 0;
            let modalidad = r.modalidad;
            if (!modalidad && g) modalidad = g.modalidad;
            fusionadas.push({
                especies: r.especies,
                nombre: r.nombre,
                intentosRaw: r.intentosRaw,
                posicion: r.posicion,
                inicio: convertirFecha(r.inicioRaw),
                final: convertirFecha(r.finalRaw),
                jugadores: jugadores,
                modalidad: modalidad
            });
        }
        return fusionadas;
    }
    
    function ordenarCompetencias(lista) {
        return lista.sort((a,b) => {
            if (a.final !== b.final) return a.final.localeCompare(b.final);
            const aRest = parseInt(a.intentosRaw.split('/')[0].trim());
            const bRest = parseInt(b.intentosRaw.split('/')[0].trim());
            if (aRest !== bRest) return aRest - bRest;
            return a.jugadores - b.jugadores;
        });
    }
    
    function generateCompsTabText(comps) {
        let lines = [];
        for (let i = 0; i < comps.length; i++) {
            const c = comps[i];
            lines.push(`${i+1}\t${c.especies}\t${c.nombre}\t${c.intentosRaw}\t${c.posicion}\t${c.inicio}\t${c.final}\t${c.jugadores}\t${c.modalidad}`);
        }
        return lines.join('\n');
    }
    
    function generateCompsHtmlTable(comps) {
        if (!comps.length) return '<p>No se encontraron competiciones.</p>';
        let html = `<table><thead><tr><th>ID</th><th>Especies</th><th>Nombre</th><th>Intentos</th><th>Posición</th><th>Inicio</th><th>Final</th><th>Jugadores</th><th>Modalidad</th></tr></thead><tbody>`;
        for (let i = 0; i < comps.length; i++) {
            const c = comps[i];
            html += `<tr>
                <td>${i+1}</td>
                <td>${escapeHtml(c.especies)}</td>
                <td>${escapeHtml(c.nombre)}</td>
                <td>${escapeHtml(c.intentosRaw)}</td>
                <td>${escapeHtml(c.posicion)}</td>
                <td>${escapeHtml(c.inicio)}</td>
                <td>${escapeHtml(c.final)}</td>
                <td>${c.jugadores}</td>
                <td>${escapeHtml(c.modalidad)}</td>
            </tr>`;
        }
        html += `</tbody></table>`;
        return html;
    }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    
    async function processScores() {
        const statusDiv = document.getElementById('scoresStatus');
        try {
            statusDiv.innerHTML = "⏳ Leyendo portapapeles...";
            let text = await navigator.clipboard.readText();
            if (!text.trim()) throw new Error("Portapapeles vacío");
            const username = extractUsername(text);
            const results = parseBestScores(text, username);
            if (!results.length) throw new Error("No se extrajeron datos");
            const tabText = generateScoresTabText(username, results);
            const htmlTable = generateScoresHtmlTable(username, results);
            document.getElementById('scoresTableContainer').innerHTML = htmlTable;
            document.getElementById('scoresOutput').innerText = tabText;
            await navigator.clipboard.writeText(tabText);
            statusDiv.innerHTML = "✅ Completado. Resultado copiado.";
        } catch(err) { statusDiv.innerHTML = `❌ Error: ${err.message}`; }
    }
    
    async function processComps() {
        const statusDiv = document.getElementById('compsStatus');
        try {
            statusDiv.innerHTML = "⏳ Leyendo portapapeles...";
            let text = await navigator.clipboard.readText();
            if (!text.trim()) throw new Error("Portapapeles vacío");
            statusDiv.innerHTML = "⚙️ Extrayendo resumen...";
            const resumen = extraerResumen(text);
            if (resumen.length === 0) throw new Error("No se encontró la sección 'Enrolled competitions'.");
            statusDiv.innerHTML = "⚙️ Extrayendo listado global...";
            const global = extraerListadoGlobal(text);
            statusDiv.innerHTML = "⚙️ Fusionando y ordenando...";
            const fusionadas = fusionarCompetencias(resumen, global);
            const ordenadas = ordenarCompetencias(fusionadas);
            const tabText = generateCompsTabText(ordenadas);
            const htmlTable = generateCompsHtmlTable(ordenadas);
            document.getElementById('compsTableContainer').innerHTML = htmlTable;
            document.getElementById('compsOutput').innerText = tabText;
            await navigator.clipboard.writeText(tabText);
            statusDiv.innerHTML = `✅ Completado. ${ordenadas.length} competiciones procesadas. Resultado copiado.`;
        } catch(err) {
            statusDiv.innerHTML = `❌ Error: ${err.message}`;
            console.error(err);
        }
    }
    
    document.getElementById('processScoresBtn').addEventListener('click', processScores);
    document.getElementById('processCompsBtn').addEventListener('click', processComps);
    
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');
    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.getAttribute('data-tab');
            panes.forEach(p => p.classList.remove('active'));
            tabs.forEach(b => b.classList.remove('active'));
            document.getElementById(`${tabId}-tab`).classList.add('active');
            btn.classList.add('active');
        });
    });
</script>
</body>
</html>
