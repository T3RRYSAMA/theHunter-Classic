<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theHunter Data Processor - Competencias corregido</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e2a2e;
            color: #e0f2fe;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #0f172a;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #fbbf24; font-size: 1.8rem; margin-top: 0; margin-bottom: 0.5rem; }
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: bold;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 0.5rem 0.5rem 0 0;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #2c4c40;
            color: #fbbf24;
        }
        .tab-btn:hover:not(.active) {
            background-color: #1e3a3a;
            color: #cbd5e1;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 0.5rem;
            resize: vertical;
            margin-bottom: 1rem;
        }
        button {
            background-color: #2c6e4f;
            border: none;
            color: white;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 9999px;
            cursor: pointer;
            margin-right: 1rem;
            margin-bottom: 1rem;
            transition: 0.2s;
        }
        button:hover {
            background-color: #3e8e6b;
            transform: scale(1.02);
        }
        .result-area {
            background-color: #0a0f1a;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            overflow-x: auto;
            display: block;
        }
        th, td {
            border: 1px solid #2d3a4f;
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #2c4c40;
            color: #fbbf24;
            cursor: pointer;
            position: sticky;
            top: 0;
        }
        .output-text {
            background-color: #0f172a;
            border: 1px solid #2d3a4f;
            font-family: monospace;
            padding: 1rem;
            white-space: pre-wrap;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            max-height: 300px;
            overflow: auto;
        }
        hr { border-color: #2d3a4f; margin: 1rem 0; }
        .status {
            background-color: #1e2a3a;
            border-left: 4px solid #fbbf24;
            padding: 8px 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🦌 theHunter Data Processor</h1>
    <div class="tabs">
        <button class="tab-btn active" data-tab="scores">🏆 Mejores Puntuaciones</button>
        <button class="tab-btn" data-tab="comps">⚔️ Competencias (corregido)</button>
    </div>

    <div id="scores-tab" class="tab-pane active">
        <p>Pega el contenido de la página <strong>"Mejores puntuaciones personales"</strong>.</p>
        <textarea id="scoresInput" placeholder="Pega aquí..."></textarea>
        <button id="processScoresBtn">🚀 PROCESAR</button>
        <div class="status" id="scoresStatus">✅ Listo.</div>
        <div class="result-area">
            <div id="scoresTableContainer">👉 Presiona "PROCESAR"</div>
            <hr>
            <div id="scoresOutput" class="output-text"></div>
        </div>
    </div>

    <div id="comps-tab" class="tab-pane">
        <p>Pega el contenido de la página <strong>"Competencias"</strong> (selecciona todo desde la página).</p>
        <textarea id="compsInput" placeholder="Pega aquí..."></textarea>
        <button id="processCompsBtn">🚀 PROCESAR</button>
        <div class="status" id="compsStatus">✅ Listo.</div>
        <div class="result-area">
            <div id="compsTableContainer">👉 Presiona "PROCESAR"</div>
            <hr>
            <div id="compsOutput" class="output-text"></div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. MEJORES PUNTUACIONES (código ya funcional, se mantiene)
    // --------------------------------------------------------------
    const ESPECIES_OFICIALES = new Set([
        "Alce", "Banteng", "Bisonte", "Búfalo de Agua", "Cabra Salvaje", "Canguro rojo",
        "Carnero de Dall", "Cerdo Salvaje", "Ciervo Axis", "Ciervo Mulo", "Ciervo Rojo",
        "Ciervo Sambar", "Ciervo Sitka", "Ciervo de Cola Blanca", "Ciervo de Cola Negra",
        "Ciervo de Timor", "Conejo Europeo", "Conejo de Cola de Algodón", "Corzo",
        "Corzonejo", "Coyote", "Faisán", "Gamo", "Ganso Nival", "Ganso Urraco",
        "Ganso de Canadá", "Hombre Lobo", "Jabalí", "Liebre Americana", "Lince",
        "Lince Boreal", "Lobo Gris", "Muflón Canadiense", "Oso Grizzly", "Oso Negro",
        "Oso Pardo", "Oso Polar", "Pavo", "Perdiz Nival", "Perdiz Nival de la Tundra",
        "Perdiz de Cola Blanca", "Puma", "Reno", "Wapití de Roosevelt", "Wapití de las Rocosas",
        "Wendigo", "Wood Grouse", "Zorro Rojo", "Zorro Ártico", "Ánade Friso", "Ánade Rabudo",
        "Ánade Real", "Ánade Sombrío Americano", "Íbice Alpino"
    ]);

    function normalizarNombre(raw) { return raw.replace(/\s*\([^)]*\)/g, '').trim(); }
    function esEspecieValida(line) { return ESPECIES_OFICIALES.has(normalizarNombre(line)); }
    function extractUsername(text) {
        const lines = text.split(/\r?\n/);
        for (let i = 0; i < lines.length - 1; i++) {
            const curr = lines[i].trim();
            const next = lines[i+1].trim();
            if (curr && !curr.includes(' ') && next.includes('Hunter') && !next.includes('Cazador')) return curr;
        }
        const match = text.match(/(?:Configuración\s+\d+)?([A-Za-z0-9_]+)\s*\nHunter/);
        return match ? match[1] : "Usuario";
    }
    function limpiarFecha(fechaRaw) {
        let fecha = fechaRaw.replace(/\s*ART\s*/i, '').trim();
        fecha = fecha.replace(/(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})/, (match, date, hour, minute) => `${date} ${hour.padStart(2,'0')}:${minute}`);
        return fecha;
    }
    function parseBestScores(text, username) {
        const lines = text.split(/\r?\n/);
        const resultados = [];
        let i = 0, total = lines.length;
        while (i < total) {
            let line = lines[i].trim();
            if (line === "") { i++; continue; }
            if (esEspecieValida(line)) {
                let especieLimpia = normalizarNombre(line);
                let puntuacion = null, arma = null, fecha = null;
                let j = i + 1;
                while (j < total && j < i + 25) {
                    const curr = lines[j].trim();
                    if (curr === "Puntuación:" || curr.startsWith("Puntuación:")) {
                        if (j+1 < total) {
                            const scoreLine = lines[j+1].trim();
                            const match = scoreLine.match(/^(\d+(?:\.\d+)?)/);
                            if (match) puntuacion = match[1].replace('.', ',');
                        }
                    }
                    if (curr === "Armas utilizadas:" || curr.startsWith("Armas utilizadas:")) {
                        if (j+1 < total) arma = lines[j+1].trim();
                    }
                    if (curr === "Fecha de captura:" || curr.startsWith("Fecha de captura:")) {
                        if (j+1 < total) fecha = limpiarFecha(lines[j+1].trim());
                    }
                    if (puntuacion && arma && fecha) break;
                    j++;
                }
                if (puntuacion) {
                    if (resultados.length === 0 || resultados[resultados.length-1].especie !== especieLimpia) {
                        resultados.push({ especie: especieLimpia, puntuacion, arma: arma || "", fecha: fecha || "" });
                    }
                }
                i = j + 1;
            } else { i++; }
        }
        return resultados;
    }
    function generateScoresTabText(username, data) {
        return data.map(item => `${username}\t${item.especie}\t${item.puntuacion}\t${item.arma}\t${item.fecha}`).join('\n');
    }
    function generateScoresHtmlTable(username, data) {
        if (!data.length) return '<p>No hay datos</p>';
        let html = `<tr><thead><tr><th>Usuario</th><th>Especie</th><th>Puntuación</th><th>Arma</th><th>Fecha</th></tr></thead><tbody>`;
        for (let item of data) html += `<tr><td>${escapeHtml(username)}</td><td>${escapeHtml(item.especie)}</td><td>${escapeHtml(item.puntuacion)}</td><td>${escapeHtml(item.arma)}</td><td>${escapeHtml(item.fecha)}</td></tr>`;
        html += `</tbody></table>`;
        return html;
    }

    // --------------------------------------------------------------
    // 2. COMPETENCIAS - NUEVO PARSEADOR ROBUSTO
    // --------------------------------------------------------------
    function parseCompetitions(text) {
        // Extraer la sección desde "Enrolled competitions" hasta "Competiciones próximas" o "Competiciones anteriores"
        const enrolledMatch = text.match(/Enrolled competitions\s*\([\d]+\)(.*?)(?=Competiciones próximas|Competiciones anteriores|$)/s);
        if (!enrolledMatch) return [];
        let section = enrolledMatch[1];
        
        // Dividir en líneas
        const lines = section.split(/\r?\n/);
        // Filtrar líneas vacías y las que contienen encabezados de tabla
        const cleanLines = [];
        for (let line of lines) {
            let trimmed = line.trim();
            if (trimmed === "") continue;
            if (trimmed.includes("Nombre de Competición") || trimmed.includes("Intentos") || trimmed.includes("Posición") || trimmed.includes("Inicio") || trimmed.includes("Final") || trimmed.includes("Estado") || trimmed.includes("Acción")) continue;
            cleanLines.push(trimmed);
        }
        
        // Ahora cada competición ocupa un bloque de 8 líneas (nombre, especie, intentos, posición, inicio, final, estado, acción)
        // Pero a veces puede haber líneas adicionales con el número de jugadores o con "Un jugador" pegado a las especies.
        // Vamos a agrupar dinámicamente: cada bloque termina cuando encontramos una línea que parece un nombre de competición (no contiene "/", no es "N/A", no es una fecha)
        const competitions = [];
        let i = 0;
        while (i < cleanLines.length) {
            // El nombre de la competición es una línea que no contiene " / " (porque los intentos sí lo tienen)
            // y no comienza con "N/A" ni con un mes (enero, febrero...)
            let nombre = cleanLines[i];
            if (nombre.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i) || nombre === "N/A" || nombre.includes("/")) {
                i++;
                continue;
            }
            if (i+7 >= cleanLines.length) break;
            
            const especiesRaw = cleanLines[i+1];
            const intentosRaw = cleanLines[i+2];
            const posicion = cleanLines[i+3];
            const inicio = cleanLines[i+4];
            const final = cleanLines[i+5];
            const estado = cleanLines[i+6];
            const accion = cleanLines[i+7];
            
            // Extraer modalidad y limpiar especies
            let modalidad = "";
            let especiesLimpia = especiesRaw;
            if (especiesRaw.includes("Un jugador")) {
                modalidad = "Un jugador";
                especiesLimpia = especiesRaw.replace("Un jugador", "").trim();
            } else if (especiesRaw.includes("Multijugador")) {
                modalidad = "Multijugador";
                especiesLimpia = especiesRaw.replace("Multijugador", "").trim();
            }
            // Quitar "(Típico)"
            especiesLimpia = especiesLimpia.replace(/\s*\(Típico\)/g, '');
            // Separar múltiples especies usando la lista oficial
            const speciesSet = new Set();
            // Primero intentar dividir por espacios y buscar en la lista, pero cuidado con nombres compuestos
            // Mejor buscar todas las especies oficiales que estén contenidas en la cadena
            for (let sp of ESPECIES_OFICIALES) {
                if (especiesLimpia.includes(sp)) {
                    speciesSet.add(sp);
                }
            }
            let especiesFinal = Array.from(speciesSet).join(" + ");
            if (especiesFinal === "") especiesFinal = especiesLimpia;
            
            // Intentos restantes es el primer número
            const intentosMatch = intentosRaw.match(/(\d+)\s*\/\s*(\d+)/);
            let intentosRestantes = 0, intentosTotal = 0;
            if (intentosMatch) {
                intentosRestantes = parseInt(intentosMatch[1]);
                intentosTotal = parseInt(intentosMatch[2]);
            }
            
            // Buscar número de jugadores: puede estar en la línea i+8 o i+9
            let jugadores = 0;
            if (i+8 < cleanLines.length) {
                const possible = cleanLines[i+8];
                if (/^\d+$/.test(possible)) {
                    jugadores = parseInt(possible);
                } else if (i+9 < cleanLines.length && /^\d+$/.test(cleanLines[i+9])) {
                    jugadores = parseInt(cleanLines[i+9]);
                }
            }
            
            competitions.push({
                nombre: nombre,
                especies: especiesFinal,
                intentosRaw: intentosRaw,
                intentosRestantes: intentosRestantes,
                intentosTotal: intentosTotal,
                posicion: posicion,
                inicio: inicio,
                final: final,
                estado: estado,
                modalidad: modalidad,
                jugadores: jugadores
            });
            i += 8;
            // Saltar posibles líneas de jugadores ya consumidas
            if (i < cleanLines.length && /^\d+$/.test(cleanLines[i])) i++;
        }
        return competitions;
    }

    function sortCompetitions(comps) {
        function parseDate(str) {
            const months = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
            const parts = str.split(' ');
            if (parts.length < 3) return new Date(0);
            const month = months[parts[0]];
            const day = parseInt(parts[1].replace(/th|st|nd|rd/, ''));
            const time = parts[2];
            const [hour, minute] = time.split(':');
            const year = new Date().getFullYear();
            let dateObj = new Date(year, month, day, parseInt(hour), parseInt(minute));
            if (dateObj < new Date() && month < new Date().getMonth()) dateObj.setFullYear(year+1);
            return dateObj;
        }
        return comps.sort((a,b) => {
            const dateA = parseDate(a.final);
            const dateB = parseDate(b.final);
            if (dateA - dateB !== 0) return dateA - dateB;
            if (a.intentosRestantes !== b.intentosRestantes) return a.intentosRestantes - b.intentosRestantes;
            return a.jugadores - b.jugadores;
        });
    }

    function generateCompsTabText(comps) {
        return comps.map(c => `${c.especies}\t${c.nombre}\t${c.intentosRaw}\t${c.posicion}\t${c.inicio}\t${c.final}\t${c.jugadores}\t${c.modalidad}`).join('\n');
    }

    function generateCompsHtmlTable(comps) {
        if (!comps.length) return '<p>No se encontraron competiciones.</p>';
        let html = `<table><thead><tr><th>Especies</th><th>Nombre</th><th>Intentos</th><th>Posición</th><th>Inicio</th><th>Final</th><th>Jugadores</th><th>Modalidad</th></tr></thead><tbody>`;
        for (let c of comps) {
            html += `<tr>
                <td>${escapeHtml(c.especies)}</td>
                <td>${escapeHtml(c.nombre)}</td>
                <td>${escapeHtml(c.intentosRaw)}</td>
                <td>${escapeHtml(c.posicion)}</td>
                <td>${escapeHtml(c.inicio)}</td>
                <td>${escapeHtml(c.final)}</td>
                <td>${c.jugadores}</td>
                <td>${escapeHtml(c.modalidad)}</td>
            </tr>`;
        }
        html += `</tbody></table>`;
        return html;
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    // Procesadores
    async function processScores() {
        const statusDiv = document.getElementById('scoresStatus');
        try {
            statusDiv.innerHTML = "⏳ Leyendo portapapeles...";
            let text = await navigator.clipboard.readText();
            if (!text.trim()) throw new Error("Portapapeles vacío");
            const username = extractUsername(text);
            const results = parseBestScores(text, username);
            if (!results.length) throw new Error("No se extrajeron datos");
            const tabText = generateScoresTabText(username, results);
            const htmlTable = generateScoresHtmlTable(username, results);
            document.getElementById('scoresTableContainer').innerHTML = htmlTable;
            document.getElementById('scoresOutput').innerText = tabText;
            await navigator.clipboard.writeText(tabText);
            statusDiv.innerHTML = "✅ Completado. Resultado copiado.";
        } catch(err) { statusDiv.innerHTML = `❌ Error: ${err.message}`; }
    }

    async function processComps() {
        const statusDiv = document.getElementById('compsStatus');
        try {
            statusDiv.innerHTML = "⏳ Leyendo portapapeles...";
            let text = await navigator.clipboard.readText();
            if (!text.trim()) throw new Error("Portapapeles vacío");
            let comps = parseCompetitions(text);
            if (!comps.length) throw new Error("No se encontraron competiciones inscritas");
            comps = sortCompetitions(comps);
            const tabText = generateCompsTabText(comps);
            const htmlTable = generateCompsHtmlTable(comps);
            document.getElementById('compsTableContainer').innerHTML = htmlTable;
            document.getElementById('compsOutput').innerText = tabText;
            await navigator.clipboard.writeText(tabText);
            statusDiv.innerHTML = "✅ Completado. Resultado copiado.";
        } catch(err) { statusDiv.innerHTML = `❌ Error: ${err.message}`; }
    }

    document.getElementById('processScoresBtn').addEventListener('click', processScores);
    document.getElementById('processCompsBtn').addEventListener('click', processComps);

    // Pestañas
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');
    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.getAttribute('data-tab');
            panes.forEach(p => p.classList.remove('active'));
            tabs.forEach(b => b.classList.remove('active'));
            document.getElementById(`${tabId}-tab`).classList.add('active');
            btn.classList.add('active');
        });
    });
</script>
</body>
</html>
